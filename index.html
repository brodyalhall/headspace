<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(#02070d 0%, #07141e 18%, #0a1b2a 38%, #081521 68%, #040910 100%);
      }

      a-scene {
        display: block;
        width: 100%;
        height: 100%;
      }

      #title-card {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(3, 7, 13, 0.22);
        color: #edf4ff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(2.4rem, 6vw, 6rem);
        letter-spacing: 0.12em;
        text-transform: lowercase;
        opacity: 1;
        transition: opacity 1.8s ease, visibility 1.8s ease;
        z-index: 10;
        pointer-events: none;
        text-shadow: 0 0 20px rgba(180, 210, 255, 0.4);
      }

      #title-card.hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="title-card">headspace.</div>

    <a-scene fog="type: linear; color: #2d4868; near: 1.2; far: 25" renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true">
      <a-assets>
        <a-asset-item id="headspace" src="headspace.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#091722"></a-sky>

      <a-entity id="stars"></a-entity>

      <a-entity id="scene-lights">
        <a-light type="ambient" color="#7d90aa" intensity="0.18"></a-light>
        <a-light type="hemisphere" color="#34506f" ground-color="#030a10" intensity="0.45"></a-light>
        <a-light type="directional" position="3 5 4" intensity="0.35" color="#506784"></a-light>
        <a-light type="directional" position="-4 2 -3" intensity="0.25" color="#1d2f42"></a-light>
        <a-light type="point" position="0 1.6 1.2" intensity="0.4" distance="18" decay="2" color="#8fa7c3"></a-light>
        <a-light type="point" position="0 0 0" intensity="0.3" distance="12" decay="2" color="#22405a"></a-light>
      </a-entity>

      <a-entity id="headspace-model" position="0 0 0" rotation="0 90 0" scale="1 1 1">
        <a-entity id="headspace-asset" gltf-model="#headspace" material="side: double; color: #d9d9d9; emissive: #101721; emissiveIntensity: 0.25"></a-entity>
      </a-entity>

      <a-entity id="ground-fog" position="0 -1.7 0">
        <a-cylinder radius="10" height="4.2" color="#4d6b8e" material="transparent: true; opacity: 0.18; roughness: 1; metalness: 0"></a-cylinder>
        <a-cylinder radius="8.2" height="3.5" color="#223d5a" material="transparent: true; opacity: 0.12; roughness: 1; metalness: 0" position="0 0.1 0"></a-cylinder>
      </a-entity>

      <a-entity id="fly-group"></a-entity>

      <a-entity id="collision-root"></a-entity>

      <a-entity id="player" position="0 0.2 0.4" scale="0.08 0.08 0.08">
        <a-light type="point" position="0 0 0" intensity="0.6" distance="3.5" decay="2" color="#b5c9e6"></a-light>
        <a-sphere radius="0.22" material="color: #b5c9e6; transparent: true; opacity: 0.04; side: double"></a-sphere>
        <a-entity camera look-controls="pointerLockEnabled: false" fly-move="speed: 0.54; verticalSpeed: 0.36"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const pressed = {};
      const collisionRoot = document.getElementById('collision-root');
      const headspaceModel = document.getElementById('headspace-model');
      const player = document.getElementById('player');

      function createCollider(size, position) {
        const collider = document.createElement('a-box');
        collider.setAttribute('class', 'collider');
        collider.setAttribute('data-collider-size', size.join(' '));
        collider.setAttribute('position', position.join(' '));
        collider.setAttribute('material', 'opacity: 0; transparent: true; visible: false');
        collisionRoot.appendChild(collider);
        return collider;
      }

      function setDoubleSidedMaterials(object3D) {
        object3D.traverse((node) => {
          if (!node.isMesh) return;

          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((material) => {
            if (!material) return;
            material.side = THREE.DoubleSide;
            material.needsUpdate = true;
          });
        });
      }

      function scaleModelToFit() {
        const asset = document.getElementById('headspace-asset');
        if (!asset || !asset.object3D || !asset.object3D.children.length) {
          player.setAttribute('position', '0 0.2 0.4');
          return;
        }

        setDoubleSidedMaterials(asset.object3D);

        const box = new THREE.Box3().setFromObject(asset.object3D);
        const size = new THREE.Vector3();
        box.getSize(size);

        const maxDim = Math.max(size.x || 1, size.y || 1, size.z || 1);
        const targetSize = 4.8;
        const scale = targetSize / maxDim;
        headspaceModel.setAttribute('scale', `${scale} ${scale} ${scale}`);

        const headAsset = document.getElementById('headspace-asset');
        headAsset.setAttribute('material', 'side: double; color: #3e3f42; emissive: #02070d; emissiveIntensity: 1.2');

        player.setAttribute('position', '0 0.2 0.4');

        collisionRoot.innerHTML = '';
      }

      document.getElementById('headspace-asset').addEventListener('model-loaded', scaleModelToFit);

      const flyColliders = [];

      function setupStars() {
        const stars = document.getElementById('stars');
        const starCount = 700;

        for (let i = 0; i < starCount; i++) {
          const star = document.createElement('a-sphere');
          const radius = 0.018 + Math.random() * 0.04;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const distance = 22 + Math.random() * 26;
          const x = Math.sin(phi) * Math.cos(theta) * distance;
          const y = Math.cos(phi) * distance * 0.9;
          const z = Math.sin(phi) * Math.sin(theta) * distance;
          const alpha = 0.8 + Math.random() * 0.9;
          const brightness = 1.1 + Math.random() * 1.8;

          star.setAttribute('radius', radius.toFixed(3));
          star.setAttribute('color', '#dfeafc');
          star.setAttribute('material', `transparent: true; opacity: ${alpha.toFixed(3)}; emissive: #dfeafc; emissiveIntensity: ${brightness.toFixed(2)}`);
          star.setAttribute('position', `${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)}`);
          stars.appendChild(star);
        }
      }

      function setupFlies() {
        const flyGroup = document.getElementById('fly-group');
        const flies = [];

        for (let i = 0; i < 10; i++) {
          const flyWrapper = document.createElement('a-entity');
          const body = document.createElement('a-sphere');
          const wingLeft = document.createElement('a-box');
          const wingRight = document.createElement('a-box');

          const radius = 0.02 + Math.random() * 0.01;
          const orbitRadius = 0.55 + Math.random() * 1.1;
          const yOffset = -0.15 + Math.random() * 0.75;
          const angleOffset = Math.random() * Math.PI * 2;
          const speed = 1.2 + Math.random() * 2.2;

          body.setAttribute('radius', radius.toFixed(3));
          body.setAttribute('color', '#191919');
          body.setAttribute('material', 'opacity: 0.9; transparent: true');
          body.setAttribute('position', '0 0 0');

          const wingScale = 0.07;
          wingLeft.setAttribute('width', '0.12');
          wingLeft.setAttribute('height', '0.015');
          wingLeft.setAttribute('depth', '0.005');
          wingLeft.setAttribute('color', '#f2f2f2');
          wingLeft.setAttribute('material', 'opacity: 0.45; transparent: true');
          wingLeft.setAttribute('rotation', '0 -10 10');
          wingLeft.setAttribute('position', '-0.04 0.01 0');

          wingRight.setAttribute('width', '0.12');
          wingRight.setAttribute('height', '0.015');
          wingRight.setAttribute('depth', '0.005');
          wingRight.setAttribute('color', '#f2f2f2');
          wingRight.setAttribute('material', 'opacity: 0.45; transparent: true');
          wingRight.setAttribute('rotation', '0 10 -10');
          wingRight.setAttribute('position', '0.04 0.01 0');

          flyWrapper.appendChild(body);
          flyWrapper.appendChild(wingLeft);
          flyWrapper.appendChild(wingRight);
          flyGroup.appendChild(flyWrapper);

          const flyData = {
            el: flyWrapper,
            body,
            wingLeft,
            wingRight,
            radius: orbitRadius,
            yOffset,
            angleOffset,
            speed,
            wobble: Math.random() * Math.PI * 2,
            pulse: Math.random() * Math.PI * 2,
            drift: Math.random() * 0.6 + 0.4,
            collisionRadius: 0.14 + Math.random() * 0.08,
          };

          flies.push(flyData);
          flyColliders.push(flyData);
        }

        function animateFlies() {
          const time = performance.now() * 0.001;
          flies.forEach((fly, index) => {
            const angle = time * fly.speed + fly.angleOffset + index * 0.55;
            const irregular = Math.sin(time * 2.6 + index * 1.7 + fly.pulse) * 0.28;
            const x = Math.cos(angle + irregular) * (fly.radius + Math.sin(time * 3 + index) * 0.18);
            const y = Math.sin(angle * 2.1 + fly.wobble) * 0.22 + fly.yOffset + Math.cos(time * 4.4 + index) * 0.09;
            const z = Math.sin(angle + fly.pulse) * (fly.radius * 0.8 + Math.cos(time * 2.8 + index) * 0.12);

            fly.currentX = x;
            fly.currentY = y;
            fly.currentZ = z;

            fly.el.setAttribute('position', `${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)}`);
            fly.el.setAttribute('rotation', `${(Math.sin(time * 30 + index) * 22).toFixed(2)} ${(time * 170 + index * 30).toFixed(2)} ${(Math.cos(time * 22 + index) * 18).toFixed(2)}`);
            const wingBeat = Math.sin(time * (26 + fly.drift) + index);
            fly.wingLeft.setAttribute('rotation', `0 ${wingBeat * 38 - 12} ${wingBeat * 14 + 12}`);
            fly.wingRight.setAttribute('rotation', `0 ${-wingBeat * 38 + 12} ${-wingBeat * 14 - 12}`);
          });
          requestAnimationFrame(animateFlies);
        }

        requestAnimationFrame(animateFlies);
      }

      setupStars();
      setupFlies();

      window.addEventListener('keydown', (event) => {
        pressed[event.code] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
          event.preventDefault();
        }
      });

      window.addEventListener('keyup', (event) => {
        pressed[event.code] = false;
      });

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function sceneCollides(position) {
        return false;
      }

      function flyCollision(position) {
        for (const fly of flyColliders) {
          const dx = position.x - fly.currentX;
          const dy = position.y - fly.currentY;
          const dz = position.z - fly.currentZ;
          const distSq = dx * dx + dy * dy + dz * dz;
          if (distSq < (fly.collisionRadius * fly.collisionRadius)) {
            return true;
          }
        }
        return false;
      }

      AFRAME.registerComponent('fly-move', {
        schema: {
          speed: { type: 'number', default: 0.54 },
          verticalSpeed: { type: 'number', default: 0.36 }
        },
        init: function () {
          this.camera = this.el;
          this.hoverTime = 0;
          this.driftTime = 0;
        },
        tick: function (time, delta) {
          if (!this.camera) return;

          const moveScale = (delta / 1000) * this.data.speed;
          const verticalScale = (delta / 1000) * this.data.verticalSpeed;
          const player = this.el.parentElement;
          const current = player.object3D.position.clone();

          const forward = new THREE.Vector3(0, 0, -1);
          const right = new THREE.Vector3(1, 0, 0);
          forward.applyQuaternion(this.camera.object3D.quaternion);
          right.applyQuaternion(this.camera.object3D.quaternion);

          this.driftTime += delta;
          const driftX = Math.sin(this.driftTime * 0.0035) * 0.008;
          const driftY = Math.cos(this.driftTime * 0.0048) * 0.006;
          const driftZ = Math.sin(this.driftTime * 0.0042 + 1.2) * 0.006;

          const move = new THREE.Vector3();
          let isMoving = false;

          if (pressed.KeyW) {
            move.add(forward);
            isMoving = true;
          }
          if (pressed.KeyS) {
            move.sub(forward);
            isMoving = true;
          }
          if (pressed.KeyA) {
            move.sub(right);
            isMoving = true;
          }
          if (pressed.KeyD) {
            move.add(right);
            isMoving = true;
          }

          if (pressed.Space) {
            move.y += 1;
            isMoving = true;
          }
          if (pressed.ShiftLeft || pressed.ShiftRight) {
            move.y -= 1;
            isMoving = true;
          }

          if (move.lengthSq() > 0) {
            move.normalize();

            const nextX = current.x + move.x * moveScale;
            const nextY = current.y + move.y * verticalScale;
            const nextZ = current.z + move.z * moveScale;

            if (!sceneCollides(new THREE.Vector3(nextX, current.y, current.z)) && !flyCollision(new THREE.Vector3(nextX, current.y, current.z))) {
              current.x = nextX;
            }
            if (!sceneCollides(new THREE.Vector3(current.x, nextY, current.z)) && !flyCollision(new THREE.Vector3(current.x, nextY, current.z))) {
              current.y = nextY;
            }
            if (!sceneCollides(new THREE.Vector3(current.x, current.y, nextZ)) && !flyCollision(new THREE.Vector3(current.x, current.y, nextZ))) {
              current.z = nextZ;
            }
          } else {
            this.hoverTime += delta;
            current.y += Math.sin(this.hoverTime * 0.012) * 0.006;
          }

          current.x += driftX;
          current.y += driftY;
          current.z += driftZ;

          current.x = clamp(current.x, -50, 50);
          current.y = clamp(current.y, -20, 20);
          current.z = clamp(current.z, -50, 50);

          player.object3D.position.copy(current);
          this.camera.object3D.rotation.z += Math.sin(this.driftTime * 0.009) * 0.00025;
          this.camera.object3D.rotation.x += Math.cos(this.driftTime * 0.011) * 0.00022;
        }
      });

      let buzzStarted = false;
      function startBuzz() {
        if (buzzStarted) return;
        buzzStarted = true;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const master = ctx.createGain();
        master.gain.value = 0.12;
        master.connect(ctx.destination);

        const toneA = ctx.createOscillator();
        toneA.type = 'sawtooth';
        toneA.frequency.value = 88;

        const toneB = ctx.createOscillator();
        toneB.type = 'triangle';
        toneB.frequency.value = 132;

        const wobble = ctx.createOscillator();
        wobble.type = 'sine';
        wobble.frequency.value = 7.5;

        const wobbleGain = ctx.createGain();
        wobbleGain.gain.value = 18;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 780;
        filter.Q.value = 0.7;

        const toneGain = ctx.createGain();
        toneGain.gain.value = 0.11;

        const noiseBuffer = ctx.createBuffer(1, 0.9 * ctx.sampleRate, ctx.sampleRate);
        const channel = noiseBuffer.getChannelData(0);
        for (let i = 0; i < channel.length; i++) {
          const envelope = 1 - (i / channel.length);
          channel[i] = (Math.random() * 2 - 1) * 0.18 * envelope;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;

        const noiseGain = ctx.createGain();
        noiseGain.gain.value = 0.18;

        wobble.connect(wobbleGain);
        wobbleGain.connect(toneA.frequency);
        wobbleGain.connect(toneB.frequency);

        toneA.connect(toneGain);
        toneB.connect(toneGain);
        toneGain.connect(filter);

        noise.connect(noiseGain);
        noiseGain.connect(filter);
        filter.connect(master);

        toneA.start();
        toneB.start();
        noise.start();
        wobble.start();
      }

      const titleCard = document.getElementById('title-card');
      setTimeout(() => {
        titleCard.classList.add('hidden');
      }, 2200);

      window.addEventListener('pointerdown', startBuzz, { once: true });
      window.addEventListener('keydown', startBuzz, { once: true });
    </script>
  </body>
</html>
