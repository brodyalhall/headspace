<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(#dfeeff 0%, #cfe3ff 40%, #b5d4ff 100%);
      }

      a-scene {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <a-scene fog="type: linear; color: #dfeeff; near: 2; far: 24" renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true">
      <a-assets>
        <a-asset-item id="headspace" src="headspace.glb"></a-asset-item>
      </a-assets>

      <a-sky color="#dfeeff"></a-sky>

      <a-entity id="scene-lights">
        <a-light type="ambient" color="#ffffff" intensity="1.3"></a-light>
        <a-light type="hemisphere" color="#f5fbff" ground-color="#cfe3ff" intensity="1.7"></a-light>
        <a-light type="directional" position="3 5 4" intensity="2.2" color="#fff7df"></a-light>
        <a-light type="directional" position="-4 2 -3" intensity="1.5" color="#dfeeff"></a-light>
        <a-light type="point" position="0 1.6 1.2" intensity="3.4" distance="18" decay="2" color="#f8fbff"></a-light>
        <a-light type="point" position="0 0 0" intensity="2.2" distance="12" decay="2" color="#dfefff"></a-light>
      </a-entity>

      <a-entity id="headspace-model" position="0 0 0" rotation="0 90 0" scale="1 1 1">
        <a-entity id="headspace-asset" gltf-model="#headspace" material="side: double; color: #d9d9d9; emissive: #101721; emissiveIntensity: 0.25"></a-entity>
      </a-entity>

      <a-entity id="collision-root"></a-entity>

      <a-entity id="player" position="0 0.2 0.4" scale="0.08 0.08 0.08">
        <a-entity camera look-controls="pointerLockEnabled: false" fly-move="speed: 0.36; verticalSpeed: 0.24"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      const pressed = {};
      const collisionRoot = document.getElementById('collision-root');
      const headspaceModel = document.getElementById('headspace-model');
      const player = document.getElementById('player');

      function createCollider(size, position) {
        const collider = document.createElement('a-box');
        collider.setAttribute('class', 'collider');
        collider.setAttribute('data-collider-size', size.join(' '));
        collider.setAttribute('position', position.join(' '));
        collider.setAttribute('material', 'opacity: 0; transparent: true; visible: false');
        collisionRoot.appendChild(collider);
        return collider;
      }

      function setDoubleSidedMaterials(object3D) {
        object3D.traverse((node) => {
          if (!node.isMesh) return;

          const mats = Array.isArray(node.material) ? node.material : [node.material];
          mats.forEach((material) => {
            if (!material) return;
            material.side = THREE.DoubleSide;
            material.needsUpdate = true;
          });
        });
      }

      function scaleModelToFit() {
        const asset = document.getElementById('headspace-asset');
        if (!asset || !asset.object3D || !asset.object3D.children.length) {
          player.setAttribute('position', '0 0.2 0.4');
          return;
        }

        setDoubleSidedMaterials(asset.object3D);

        const box = new THREE.Box3().setFromObject(asset.object3D);
        const size = new THREE.Vector3();
        box.getSize(size);

        const maxDim = Math.max(size.x || 1, size.y || 1, size.z || 1);
        const targetSize = 4.8;
        const scale = targetSize / maxDim;
        headspaceModel.setAttribute('scale', `${scale} ${scale} ${scale}`);

        player.setAttribute('position', '0 0.2 0.4');

        collisionRoot.innerHTML = '';
      }

      document.getElementById('headspace-asset').addEventListener('model-loaded', scaleModelToFit);

      window.addEventListener('keydown', (event) => {
        pressed[event.code] = true;
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
          event.preventDefault();
        }
      });

      window.addEventListener('keyup', (event) => {
        pressed[event.code] = false;
      });

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function sceneCollides(position) {
        return false;
      }

      AFRAME.registerComponent('fly-move', {
        schema: {
          speed: { type: 'number', default: 0.36 },
          verticalSpeed: { type: 'number', default: 0.24 }
        },
        init: function () {
          this.camera = this.el;
          this.hoverTime = 0;
        },
        tick: function (time, delta) {
          if (!this.camera) return;

          const moveScale = (delta / 1000) * this.data.speed;
          const verticalScale = (delta / 1000) * this.data.verticalSpeed;
          const player = this.el.parentElement;
          const current = player.object3D.position.clone();

          const forward = new THREE.Vector3(0, 0, -1);
          const right = new THREE.Vector3(1, 0, 0);
          forward.applyQuaternion(this.camera.object3D.quaternion);
          right.applyQuaternion(this.camera.object3D.quaternion);

          const move = new THREE.Vector3();
          let isMoving = false;

          if (pressed.KeyW) {
            move.add(forward);
            isMoving = true;
          }
          if (pressed.KeyS) {
            move.sub(forward);
            isMoving = true;
          }
          if (pressed.KeyA) {
            move.sub(right);
            isMoving = true;
          }
          if (pressed.KeyD) {
            move.add(right);
            isMoving = true;
          }

          if (pressed.Space) {
            move.y += 1;
            isMoving = true;
          }
          if (pressed.ShiftLeft || pressed.ShiftRight) {
            move.y -= 1;
            isMoving = true;
          }

          if (move.lengthSq() > 0) {
            move.normalize();

            const nextX = current.x + move.x * moveScale;
            const nextY = current.y + move.y * verticalScale;
            const nextZ = current.z + move.z * moveScale;

            if (!sceneCollides(new THREE.Vector3(nextX, current.y, current.z))) {
              current.x = nextX;
            }
            if (!sceneCollides(new THREE.Vector3(current.x, nextY, current.z))) {
              current.y = nextY;
            }
            if (!sceneCollides(new THREE.Vector3(current.x, current.y, nextZ))) {
              current.z = nextZ;
            }
          } else {
            this.hoverTime += delta;
            current.y += Math.sin(this.hoverTime * 0.006) * 0.004;
          }

          current.x = clamp(current.x, -50, 50);
          current.y = clamp(current.y, -20, 20);
          current.z = clamp(current.z, -50, 50);

          player.object3D.position.copy(current);
        }
      });

      let buzzStarted = false;
      function startBuzz() {
        if (buzzStarted) return;
        buzzStarted = true;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;

        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }

        const master = ctx.createGain();
        master.gain.value = 0.12;
        master.connect(ctx.destination);

        const toneA = ctx.createOscillator();
        toneA.type = 'triangle';
        toneA.frequency.value = 120;

        const toneB = ctx.createOscillator();
        toneB.type = 'sine';
        toneB.frequency.value = 175;

        const lfo = ctx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 4.5;

        const lfoGain = ctx.createGain();
        lfoGain.gain.value = 24;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 900;
        filter.Q.value = 0.8;

        const toneGain = ctx.createGain();
        toneGain.gain.value = 0.18;

        const noiseBuffer = ctx.createBuffer(1, 0.7 * ctx.sampleRate, ctx.sampleRate);
        const channel = noiseBuffer.getChannelData(0);
        for (let i = 0; i < channel.length; i++) {
          channel[i] = (Math.random() * 2 - 1) * 0.12;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        noise.loop = true;

        const noiseGain = ctx.createGain();
        noiseGain.gain.value = 0.08;

        lfo.connect(lfoGain);
        lfoGain.connect(toneA.frequency);
        lfoGain.connect(toneB.frequency);

        toneA.connect(toneGain);
        toneB.connect(toneGain);
        toneGain.connect(filter);

        noise.connect(noiseGain);
        noiseGain.connect(filter);
        filter.connect(master);

        toneA.start();
        toneB.start();
        noise.start();
        lfo.start();
      }

      window.addEventListener('pointerdown', startBuzz, { once: true });
      window.addEventListener('keydown', startBuzz, { once: true });
    </script>
  </body>
</html>
